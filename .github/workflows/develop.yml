name: Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build, analyse and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Uses the latest commit from the branch when running a pull request instead of compiling a merge commit
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: ./.github/actions/setup
        with:
          free-disk-space: false
          bitwarden: false
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run buildSrc unit tests
        run: ./gradlew -p buildSrc test --stacktrace

      - name: Analyse code, build and test everything
        run: >
          ./gradlew
          build
          verifyPaparazzi
          --scan
          --stacktrace

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/build/test-results/**/*.xml"

      - name: Lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Lint-reports
          path: "**/build/reports/lint-*.html"

      - name: Detekt reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Detekt-reports
          path: "**/build/reports/detekt/*.html"

      - name: Paparazzi failures screens
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Paparazzi-failures
          path: "**/build/paparazzi/failures/**/*.png"

      - name: APKs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: APKs
          path: "**/build/outputs/apk/**/*.apk"

      - name: Configuration cache reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Configuration-cache-report
          path: "build/reports/configuration-cache/*/*/configuration-cache-report.html"

      - name: Resources monitor report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Resource-monitor-report
          path: "build/reports/resources/*.csv"

  # Runs alongside the build job, the emulators mostly wait on the device, not on the CPU
  android-test:
    name: Instrumented tests and screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Uses the latest commit from the branch when running a pull request instead of compiling a merge commit
          ref: ${{ github.event.pull_request.head.ref }}

      # setup-gradle falls back on the build job's cache, which holds nearly everything this job
      # needs: saving another one on develop would only add minutes at the end of this job.
      # The runner has about 86 GB free, plenty for the emulators without freeing any
      - uses: ./.github/actions/setup
        with:
          free-disk-space: false
          bitwarden: false
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-cache-read-only: true

      - name: Run the instrumented tests and take the screenshots
        run: >
          ./gradlew
          pixel2api34DebugAndroidTest
          copyScreenshot
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=2
          --scan
          --stacktrace

      - name: Instrumented tests reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Instrumented-reports
          path: "**/build/reports/androidTests/**/*.html"

      - name: Screenshots report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Screenshots-reports
          path: "**/graphics/phone-screenshots/*.png"

      - name: Instrumented tests APKs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AndroidTest-APKs
          path: "**/build/outputs/apk/androidTest/**/*.apk"

      - name: Configuration cache reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Configuration-cache-report-instrumented
          path: "build/reports/configuration-cache/*/*/configuration-cache-report.html"

      - name: Resources monitor report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Resource-monitor-report-instrumented
          path: "build/reports/resources/*.csv"

  # The check the develop ruleset requires, passing only once both jobs above have
  report:
    name: Build everything, test and report
    needs: [ build, android-test ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs' results
        run: |
          echo "build: ${{ needs.build.result }}, android-test: ${{ needs.android-test.result }}"
          test "${{ needs.build.result }}" = success
          test "${{ needs.android-test.result }}" = success

# The iOS app's Xcode project: `xcodegen` (brew install xcodegen) generates it from this file, see
# README.md
name: PersistentTPMS
options:
  bundleIdPrefix: com.aveshev
  deploymentTarget:
    iOS: "17.0"
packages:
  TPMSCore:
    path: Packages/TPMSCore
targets:
  PersistentTPMS:
    type: application
    platform: iOS
    sources: [App/Sources, App/Assets.xcassets]
    dependencies:
      - package: TPMSCore
    # The version, see Version.base.xcconfig
    configFiles:
      Debug: Version.base.xcconfig
      Release: Version.base.xcconfig
    preBuildScripts:
      # Without Gradle, which takes seconds even when nothing changed: only checks
      # Version.xcconfig was written for this commit. A warning in Debug, an error in Release, so
      # an upload never goes out with another build's version.
      - name: Check the version
        basedOnDependencyAnalysis: false
        script: |
          head=$(git -C "$SRCROOT" rev-parse HEAD 2>/dev/null)
          if [ "$APP_VERSION_NAME" = unversioned ]; then
            problem="ios/Version.xcconfig is missing"
          elif [ -n "$head" ] && [ "$APP_VERSION_COMMIT" != "$head" ]; then
            problem="ios/Version.xcconfig ($APP_VERSION_NAME) was written for another commit"
          fi
          if [ -n "$problem" ]; then
            if [ "$CONFIGURATION" = Release ]; then
              echo "error: $problem, run ./gradlew writeIosVersion from the repository's root"
              exit 1
            fi
            echo "warning: $problem, run ./gradlew writeIosVersion from the repository's root"
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Persistent TPMS
        # From Version.base.xcconfig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The full version, the Android versionName, shown in the app settings
        PersistentTPMSVersionName: $(APP_VERSION_NAME)
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central, audio]
        NSBluetoothAlwaysUsageDescription: Persistent TPMS listens to your tyre pressure sensors over Bluetooth.
        NSCameraUsageDescription: Persistent TPMS scans the QR code of your tyre pressure sensors to assign them.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Lite, like the Android app's Lite
        PRODUCT_BUNDLE_IDENTIFIER: com.aveshev.persistenttpms.lite
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CLAC2W57ZD
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
